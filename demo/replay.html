<style>* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
header h1 { font-size: 16px; font-weight: 600; }
header span { font-size: 13px; color: #94a3b8; }
.map-wrap { flex: 1; min-height: 0; position: relative; }
#map { width: 100%; height: 100%; }
.chart-wrap { background: #16213e; border-top: 1px solid #0f3460; padding: 12px 20px 8px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
.chart-header h2 { font-size: 13px; font-weight: 600; color: #eee; }
.chart-hint { font-size: 11px; color: #94a3b8; }
.chart-toggles { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.chart-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; cursor: pointer; user-select: none; }
.chart-toggle input { accent-color: #e94560; cursor: pointer; }
.chart-toggle input:disabled { cursor: not-allowed; opacity: 0.5; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.swatch-speed { background: #2ecc71; }
.swatch-hr { background: #e94560; }
.chart-stage { position: relative; }
#speed-chart { width: 100%; height: 160px; display: block; cursor: crosshair; }
#chart-cursor { position: absolute; top: 0; left: 0; width: 0; height: 100%; pointer-events: none; will-change: transform; }
.chart-cursor-line { position: absolute; top: 12px; bottom: 28px; left: -1px; width: 2px; background: #94a3b8; box-shadow: 0 0 6px rgba(148,163,184,0.4); }
.chart-cursor-dot { position: absolute; left: -5px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 6px rgba(0,0,0,0.45); transform: translateY(-50%); }
.chart-cursor-dot-speed { background: #2ecc71; }
.chart-cursor-dot-hr { background: #e94560; }
.panel { background: #16213e; border-top: 1px solid #0f3460; padding: 16px 20px 20px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
}
.stat { background: #1a1a2e; border-radius: 8px; padding: 12px; text-align: center; }
.stat .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat .unit { font-size: 12px; color: #64748b; }
.controls { display: flex; align-items: center; gap: 12px; }
.controls label { font-size: 12px; color: #94a3b8; min-width: 42px; }
#play-btn { width: 40px; height: 40px; border: none; border-radius: 50%; background: #e94560; color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#play-btn:hover { background: #ff6b81; }
#play-btn:disabled { background: #475569; cursor: default; }
input[type=range] { flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px; background: #0f3460; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #e94560; cursor: pointer; }
.speed-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.speed-row .label { font-size: 12px; color: #94a3b8; min-width: 52px; }
.speed-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.speed-btns button { padding: 6px 12px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #94a3b8; font-size: 12px; cursor: pointer; }
.speed-btns button:hover { border-color: #e94560; color: #eee; }
.speed-btns button.active { background: #e94560; border-color: #e94560; color: #fff; }
/* Transparent Leaflet shell — default .leaflet-div-icon border shifts the pin */
.boat-div-icon { background: transparent !important; border: none !important; }
/* Dot center is the GPS point: iconSize 90×40, iconAnchor [45, 32] (center of 16px disc at bottom) */
.boat-marker { position: relative; width: 90px; height: 40px; margin: 0; padding: 0; }
.speed-badge { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; background: rgba(22,33,62,0.95); border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.45); pointer-events: none; }
.dot-marker { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: #e94560; border: 3px solid #fff; border-radius: 50%; width: 16px; height: 16px; box-sizing: border-box; box-shadow: 0 0 8px rgba(233,69,96,0.6); }</style>

// --- Timeline chart (speed ± heart rate overlay) ---
const chartCanvas = document.getElementById("speed-chart");
const chartCursor = document.getElementById("chart-cursor");
const chartCursorDotSpeed = chartCursor.querySelector(".chart-cursor-dot-speed");
const chartCursorDotHr = chartCursor.querySelector(".chart-cursor-dot-hr");
const toggleSpeed = document.getElementById("toggle-speed");
const toggleHr = document.getElementById("toggle-hr");
const chartCtx = chartCanvas.getContext("2d");

const HAS_HR = POINTS.some((p) => (p.hr || 0) > 0);
const maxSpeedRaw = Math.max(...POINTS.map((p) => p.speed), 1);
const maxHrRaw = Math.max(...POINTS.map((p) => p.hr || 0), 1);
const CHART = {
  padL: 44,
  padR: 16,
  padT: 12,
  padB: 28,
  maxSpeed: Math.ceil(maxSpeedRaw + 1),
  maxHr: Math.max(120, Math.ceil(maxHrRaw / 10) * 10 + 10),
};
let chartGeomCache = null;
let showSpeed = true;
let showHr = false;

if (toggleHr) {
  if (!HAS_HR) {
    toggleHr.disabled = true;
    toggleHr.title = "No heart rate in this file";
    const lab = toggleHr.closest("label");
    if (lab) lab.title = "No heart rate in this file";
  }
  toggleHr.checked = false;
}
if (toggleSpeed) toggleSpeed.checked = true;

function chartGeom() {
  const dpr = window.devicePixelRatio || 1;
  const rect = chartCanvas.getBoundingClientRect();
  const padR = showHr ? 40 : 16;
  if (
    !chartGeomCache ||
    chartGeomCache.w !== rect.width ||
    chartGeomCache.h !== rect.height ||
    chartGeomCache.padR !== padR
  ) {
    CHART.padR = padR;
    chartCanvas.width = rect.width * dpr;
    chartCanvas.height = rect.height * dpr;
    chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    chartGeomCache = {
      w: rect.width,
      h: rect.height,
      padR,
      plotW: rect.width - CHART.padL - CHART.padR,
      plotH: rect.height - CHART.padT - CHART.padB,
    };
    drawChartBase();
  }
  return chartGeomCache;
}

function progressToX(progress, plotW) {
  return CHART.padL + progress * plotW;
}

function speedToY(speed, plotH) {
  return CHART.padT + plotH - (speed / CHART.maxSpeed) * plotH;
}

function hrToY(hr, plotH) {
  return CHART.padT + plotH - (hr / CHART.maxHr) * plotH;
}

function xToProgress(x, plotW) {
  return Math.max(0, Math.min(1, (x - CHART.padL) / plotW));
}

function drawSeries(getY, color, fill) {
  const { plotW, plotH } = chartGeomCache;
  if (fill) {
    chartCtx.fillStyle = fill;
    chartCtx.beginPath();
    chartCtx.moveTo(progressToX(0, plotW), speedToY(0, plotH));
    for (let i = 0; i < POINTS.length; i++) {
      chartCtx.lineTo(progressToX(i / (POINTS.length - 1), plotW), getY(POINTS[i], plotH));
    }
    chartCtx.lineTo(progressToX(1, plotW), speedToY(0, plotH));
    chartCtx.closePath();
    chartCtx.fill();
  }
  chartCtx.strokeStyle = color;
  chartCtx.lineWidth = 1.5;
  chartCtx.beginPath();
  for (let i = 0; i < POINTS.length; i++) {
    const x = progressToX(i / (POINTS.length - 1), plotW);
    const y = getY(POINTS[i], plotH);
    if (i === 0) chartCtx.moveTo(x, y);
    else chartCtx.lineTo(x, y);
  }
  chartCtx.stroke();
}

function drawChartBase() {
  const { w, h, plotW, plotH } = chartGeomCache;
  chartCtx.clearRect(0, 0, w, h);
  chartCtx.fillStyle = "#1a1a2e";
  chartCtx.fillRect(CHART.padL, CHART.padT, plotW, plotH);

  chartCtx.strokeStyle = "#0f3460";
  chartCtx.lineWidth = 1;
  if (showSpeed) {
    for (let tick = 0; tick <= CHART.maxSpeed; tick += 4) {
      const y = speedToY(tick, plotH);
      chartCtx.beginPath();
      chartCtx.moveTo(CHART.padL, y);
      chartCtx.lineTo(CHART.padL + plotW, y);
      chartCtx.stroke();
      chartCtx.fillStyle = "#64748b";
      chartCtx.font = "10px sans-serif";
      chartCtx.textAlign = "right";
      chartCtx.fillText(String(tick), CHART.padL - 6, y + 3);
    }
  } else if (showHr) {
    const step = CHART.maxHr > 160 ? 20 : 10;
    for (let tick = 0; tick <= CHART.maxHr; tick += step) {
      const y = hrToY(tick, plotH);
      chartCtx.beginPath();
      chartCtx.moveTo(CHART.padL, y);
      chartCtx.lineTo(CHART.padL + plotW, y);
      chartCtx.stroke();
      chartCtx.fillStyle = "#64748b";
      chartCtx.font = "10px sans-serif";
      chartCtx.textAlign = "right";
      chartCtx.fillText(String(tick), CHART.padL - 6, y + 3);
    }
  }

  if (showHr && showSpeed) {
    const step = CHART.maxHr > 160 ? 20 : 10;
    chartCtx.fillStyle = "#e94560";
    chartCtx.font = "10px sans-serif";
    chartCtx.textAlign = "left";
    for (let tick = 0; tick <= CHART.maxHr; tick += step) {
      const y = hrToY(tick, plotH);
      chartCtx.fillText(String(tick), CHART.padL + plotW + 6, y + 3);
    }
  }

  const tickCount = 6;
  chartCtx.textAlign = "center";
  chartCtx.fillStyle = "#94a3b8";
  for (let t = 0; t <= tickCount; t++) {
    const idx = Math.round((t / tickCount) * (POINTS.length - 1));
    chartCtx.fillText(
      POINTS[idx].t.slice(0, 5),
      progressToX(idx / (POINTS.length - 1), plotW),
      h - 8
    );
  }

  if (showSpeed) {
    drawSeries((p, plotH) => speedToY(p.speed, plotH), "#2ecc71", "rgba(46, 204, 113, 0.12)");
  }
  if (showHr && HAS_HR) {
    drawSeries((p, plotH) => hrToY(p.hr || 0, plotH), "#e94560", null);
  }

  chartCtx.font = "11px sans-serif";
  chartCtx.textAlign = "left";
  if (showSpeed) {
    chartCtx.fillStyle = "#2ecc71";
    chartCtx.fillText("km/h", 6, CHART.padT + 10);
  } else if (showHr) {
    chartCtx.fillStyle = "#e94560";
    chartCtx.fillText("bpm", 6, CHART.padT + 10);
  }
  if (showHr && showSpeed) {
    chartCtx.fillStyle = "#e94560";
    chartCtx.textAlign = "right";
    chartCtx.fillText("bpm", w - 4, CHART.padT + 10);
  }
  chartCtx.fillStyle = "#94a3b8";
  chartCtx.textAlign = "left";
  chartCtx.fillText("HKT", CHART.padL + plotW / 2 - 10, h - 22);

  if (!showSpeed && !showHr) {
    chartCtx.fillStyle = "#94a3b8";
    chartCtx.textAlign = "center";
    chartCtx.fillText("Enable Speed and/or Heart rate above", CHART.padL + plotW / 2, CHART.padT + plotH / 2);
  }
}

function redrawChart() {
  chartGeomCache = null;
  chartGeom();
  const i = +slider.value;
  const p = POINTS[i];
  moveChartCursor(i / (POINTS.length - 1), p.speed, p.hr || 0);
}

function moveChartCursor(progress, speed, hr) {
  const { plotW, plotH } = chartGeom();
  chartCursor.style.transform = `translateX(${progressToX(progress, plotW)}px)`;
  if (chartCursorDotSpeed) {
    chartCursorDotSpeed.hidden = !showSpeed;
    if (showSpeed) chartCursorDotSpeed.style.top = `${speedToY(speed, plotH)}px`;
  }
  if (chartCursorDotHr) {
    chartCursorDotHr.hidden = !(showHr && HAS_HR);
    if (showHr && HAS_HR) chartCursorDotHr.style.top = `${hrToY(hr || 0, plotH)}px`;
  }
}

if (toggleSpeed) {
  toggleSpeed.addEventListener("change", () => {
    showSpeed = toggleSpeed.checked;
    // Keep at least one series if HR available
    if (!showSpeed && !showHr && HAS_HR) {
      showHr = true;
      if (toggleHr) toggleHr.checked = true;
    } else if (!showSpeed && !HAS_HR) {
      showSpeed = true;
      toggleSpeed.checked = true;
    }
    redrawChart();
  });
}
if (toggleHr) {
  toggleHr.addEventListener("change", () => {
    if (!HAS_HR) {
      toggleHr.checked = false;
      return;
    }
    showHr = toggleHr.checked;
    if (!showSpeed && !showHr) {
      showSpeed = true;
      if (toggleSpeed) toggleSpeed.checked = true;
    }
    redrawChart();
  });
}

// --- Playback state ---
function stateAtElapsed(elapsed) {
  let lo = 0;
  let hi = POINTS.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (POINTS[mid].elapsed <= elapsed) lo = mid;
    else hi = mid;
  }
  const a = POINTS[lo];
  const b = POINTS[Math.min(lo + 1, POINTS.length - 1)];
  const span = Math.max(b.elapsed - a.elapsed, 0.001);
  const frac = Math.max(0, Math.min(1, (elapsed - a.elapsed) / span));
  const aHr = a.hr || 0;
  const bHr = b.hr || 0;
  return {
    idx: lo,
    frac,
    progress: (lo + frac) / (POINTS.length - 1),
    elapsed,
    lat: a.lat + (b.lat - a.lat) * frac,
    lon: a.lon + (b.lon - a.lon) * frac,
    speed: a.speed + (b.speed - a.speed) * frac,
    distance: a.distance + (b.distance - a.distance) * frac,
    cadence: frac < 0.5 ? a.cadence : b.cadence,
    hr: aHr + (bHr - aHr) * frac,
    time: frac < 0.5 ? a.t : b.t,
  };
}

let trailCacheIdx = -1;
let trailCacheLatLngs = [];

function resetTrailCache(idx) {
  trailCacheIdx = idx;
  trailCacheLatLngs = POINTS.slice(0, idx + 1).map((p) => [p.lat, p.lon]);
}

function updateTrail(state) {
  if (state.idx < trailCacheIdx) resetTrailCache(state.idx);
  if (state.idx > trailCacheIdx) {
    for (let i = trailCacheIdx + 1; i <= state.idx; i++) {
      trailCacheLatLngs.push([POINTS[i].lat, POINTS[i].lon]);
    }
    trailCacheIdx = state.idx;
  }
  trail.setLatLngs(trailCacheLatLngs.concat([[state.lat, state.lon]]));
}

const slider = document.getElementById("slider");
const playBtn = document.getElementById("play-btn");
const speedBtns = document.getElementById("speed-btns");
const SESSION_DURATION = POINTS[POINTS.length - 1].elapsed;
const BASE_PLAY_SECONDS = 120;
const SPEED_KEYS = { 1: 0.25, 2: 0.5, 3: 1, 4: 2, 5: 4 };

let playing = false;
let playbackRate = 1;
let playStartWall = 0;
let playStartElapsed = 0;
/** Exact session elapsed (seconds) for resume / scrub — not just slider index. */
let resumeElapsed = 0;
let rafId = null;
let lastStatsIdx = -1;

function applyState(state, syncSlider) {
  updateTrail(state);
  dot.setLatLng([state.lat, state.lon]);
  const badge = mapSpeedEl();
  if (badge) badge.textContent = `${state.speed.toFixed(1)} km/h`;
  moveChartCursor(state.progress, state.speed, state.hr || 0);

  if (syncSlider) slider.value = state.idx;

  if (state.idx !== lastStatsIdx) {
    lastStatsIdx = state.idx;
    document.getElementById("v-time").textContent = state.time;
    document.getElementById("v-cadence").textContent = state.cadence > 0 ? state.cadence : "—";
  }
  document.getElementById("v-speed").textContent = state.speed.toFixed(1);
  document.getElementById("v-dist").textContent = (state.distance / 1000).toFixed(2);
  const hrEl = document.getElementById("v-hr");
  if (hrEl) {
    const hr = state.hr || 0;
    hrEl.textContent = hr > 0 ? String(Math.round(hr)) : "—";
  }
}

function update(i) {
  const p = POINTS[i];
  lastStatsIdx = -1;
  resetTrailCache(i);
  resumeElapsed = p.elapsed;
  applyState(
    {
      idx: i,
      frac: 0,
      progress: i / (POINTS.length - 1),
      lat: p.lat,
      lon: p.lon,
      speed: p.speed,
      distance: p.distance,
      cadence: p.cadence,
      hr: p.hr || 0,
      time: p.t,
    },
    true
  );
}

function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? "⏸" : "▶";
  playBtn.title = on ? "Pause" : "Play";
}

function elapsedNow() {
  const wallSec = (performance.now() - playStartWall) / 1000 * playbackRate;
  return Math.min(SESSION_DURATION, playStartElapsed + (wallSec / BASE_PLAY_SECONDS) * SESSION_DURATION);
}

function pause() {
  if (playing) {
    const elapsed = elapsedNow();
    const state = stateAtElapsed(elapsed);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    setPlaying(false);
    // Keep exact pause time + interpolated position (no snap-jump)
    resumeElapsed = elapsed;
    slider.value = state.idx;
    applyState(state, true);
    return;
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  setPlaying(false);
}

function syncPlayAnchor() {
  playStartElapsed = playing ? elapsedNow() : resumeElapsed;
  playStartWall = performance.now();
  if (playing) resumeElapsed = playStartElapsed;
}

function setPlaybackRate(rate) {
  playbackRate = rate;
  speedBtns.querySelectorAll("button").forEach((btn) => {
    btn.classList.toggle("active", +btn.dataset.rate === rate);
  });
  if (playing) syncPlayAnchor();
}

function tick() {
  if (!playing) return;
  const elapsed = elapsedNow();
  resumeElapsed = elapsed;
  if (elapsed >= SESSION_DURATION) {
    pause();
    update(POINTS.length - 1);
    return;
  }
  applyState(stateAtElapsed(elapsed), false);
  rafId = requestAnimationFrame(tick);
}

function play() {
  // At end → restart from beginning; otherwise resume exact pause/scrub time
  if (resumeElapsed >= SESSION_DURATION - 1e-6) {
    resumeElapsed = 0;
    slider.value = 0;
    update(0);
    playStartElapsed = 0;
  } else {
    playStartElapsed = resumeElapsed;
  }
  playStartWall = performance.now();
  lastStatsIdx = -1;
  setPlaying(true);
  rafId = requestAnimationFrame(tick);
}

function scrubTo(idx) {
  // Sync to live playback position first (slider is stale while playing)
  if (playing) pause();
  const i = Math.max(0, Math.min(POINTS.length - 1, idx));
  slider.value = i;
  update(i); // sets resumeElapsed to that sample
}

/** Step ←/→ from the true current sample (pause anchor if mid-play). */
function stepBy(delta) {
  if (playing) pause();
  const base = stateAtElapsed(resumeElapsed).idx;
  scrubTo(base + delta);
}

// --- Event listeners ---
playBtn.addEventListener("click", () => (playing ? pause() : play()));
slider.addEventListener("input", (e) => {
  if (playing) pause();
  update(+e.target.value);
});
speedBtns.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-rate]");
  if (btn) setPlaybackRate(+btn.dataset.rate);
});
chartCanvas.addEventListener("click", (e) => {
  const rect = chartCanvas.getBoundingClientRect();
  const { plotW } = chartGeom();
  const idx = Math.round(xToProgress(e.clientX - rect.left, plotW) * (POINTS.length - 1));
  if (playing) pause();
  slider.value = idx;
  update(idx);
});
window.addEventListener("resize", () => {
  chartGeomCache = null;
  chartGeom();
  const p = POINTS[+slider.value];
  moveChartCursor(+slider.value / (POINTS.length - 1), p.speed, p.hr || 0);
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, select")) return;
  if (e.code === "Space") {
    e.preventDefault();
    playing ? pause() : play();
  } else if (e.code === "ArrowLeft") {
    e.preventDefault();
    stepBy(-1);
  } else if (e.code === "ArrowRight") {
    e.preventDefault();
    stepBy(1);
  } else if (SPEED_KEYS[e.key]) {
    e.preventDefault();
    setPlaybackRate(SPEED_KEYS[e.key]);
  }
});

chartGeom();
update(0);</script>
